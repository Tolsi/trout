[package]
name = "class-groups"
version = "0.1.0"
edition = "2024"

[dependencies]
subtle = { version = "2", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["std", "derive"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
crypto-bigint = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
crypto-bigint_xgcd = { package = "crypto-bigint", git = "https://github.com/kayabaNerve/crypto-bigint", rev = "bd389e20520854d386065fd041f5c91d0006413d", features = ["alloc", "zeroize", "extra-sizes"] }
crypto-primes = { version = "=0.6.2", default-features = false }
malachite = { version = "0.5", default-features = false, features = ["naturals_and_integers"] }
rug = { version = "1", default-features = false, features = ["std", "integer"], optional = true }

[dev-dependencies]
rand_chacha = { version = "0.3", default-features = false, features = ["std"] }

[features]
gmp = ["rug"]
