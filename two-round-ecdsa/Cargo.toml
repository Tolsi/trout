[package]
name = "two-round-ecdsa"
version = "0.1.0"
edition = "2024"

[dependencies]
subtle = { version = "2", default-features = false, features = ["std"] }
zeroize = { version = "1", default-features = false, features = ["std", "derive"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }
rand_chacha = { version = "0.3", default-features = false, features = ["std"] }

crypto-bigint = { version = "0.6", default-features = false, features = ["zeroize", "alloc"] }
crypto-primes = { version = "=0.6.2", default-features = false }
rug = { version = "1", default-features = false, features = ["std", "integer"], optional = true }

group = { version = "0.13", default-features = false, features = ["alloc"] }
dkg = { version = "0.5", default-features = false, features = ["std"] }

class-groups = { path = "../class-groups" }

blake3 = { version = "1", default-features = false, features = ["std"] }

ciphersuite = { git = "https://github.com/kayabaNerve/fcmp-plus-plus", rev = "78754718faa21f0a5751fbd30c9495d7f7f5c2b1", default-features = false, features = ["std"], optional = true }
generalized-bulletproofs = { git = "https://github.com/kayabaNerve/fcmp-plus-plus", rev = "78754718faa21f0a5751fbd30c9495d7f7f5c2b1", default-features = false, features = ["std"], optional = true }
generalized-bulletproofs-circuit-abstraction = { git = "https://github.com/kayabaNerve/fcmp-plus-plus", rev = "78754718faa21f0a5751fbd30c9495d7f7f5c2b1", default-features = false, features = ["std"], optional = true }

sha2 = { version = "0.10", default-features = false, features = ["std"], optional = true }
k256 = { version = "0.13", default-features = false, features = ["std", "arithmetic", "bits"], optional = true }
# ec-divisors defines an abstraction for getting a point's XY coordinates which we need for secq256k1 points
ec-divisors = { git = "https://github.com/serai-dex/serai", rev = "3655dc723f91d7123fff0147beedcc001e7e73de", default-features = false, features = ["std"], optional = true }
secq256k1 = { git = "https://github.com/serai-dex/serai", rev = "3655dc723f91d7123fff0147beedcc001e7e73de", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
ecdsa = { version = "0.16", default-features = false, features = ["std", "verifying"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[features]
gmp = ["rug", "class-groups/gmp"]
ddh-evrf = ["ciphersuite", "generalized-bulletproofs", "generalized-bulletproofs-circuit-abstraction"]
secp256k1 = ["sha2", "k256", "ciphersuite/secp256k1", "ec-divisors", "secq256k1", "ddh-evrf"]
default = ["ddh-evrf"]
